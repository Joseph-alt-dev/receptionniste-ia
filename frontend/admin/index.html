<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Administration — Réceptionniste IA</title>
<link rel="stylesheet" href="/site/style.css">
<style>
  .salons { color: var(--muted); font-size: 0.88rem; }
</style>
</head>
<body>
  <div class="top-bar">
    <h1>Administration</h1>
    <p class="subtitle" style="margin:0">comptes de la plateforme</p>
  </div>

  <div class="page">
    <p id="message" style="text-align:center"></p>

    <div id="wrap-login" style="display:none">
      <div class="auth-wrap" style="min-height: 30vh">
        <div class="page-narrow">
          <div class="card">
            <h1>Connexion admin</h1>
            <form id="login-form">
              <input type="email" id="login-email" placeholder="email admin" required>
              <input type="password" id="login-mot-de-passe" placeholder="mot de passe" required>
              <button type="submit" class="primary">Se connecter</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="section-card" id="table-comptes" style="display:none">
      <table>
        <thead>
          <tr><th>Email</th><th>Statut</th><th>Salons</th><th>Action</th></tr>
        </thead>
        <tbody id="corps-tableau"></tbody>
      </table>
    </div>
  </div>

<script>
async function chargerComptes() {
  const res = await fetch('/admin/comptes', { credentials: 'include' });

  if (res.status === 401) {
    afficherLogin("Connectez-vous avec un compte administrateur.");
    return;
  }
  if (res.status === 403) {
    afficherMessage("Ce compte n'a pas les droits administrateur.");
    return;
  }
  if (!res.ok) {
    afficherMessage("Erreur inattendue lors du chargement des comptes.");
    return;
  }

  const comptes = await res.json();
  afficherTableau(comptes);
}

function afficherMessage(texte) {
  document.getElementById('message').textContent = texte;
  document.getElementById('wrap-login').style.display = 'none';
  document.getElementById('table-comptes').style.display = 'none';
}

function afficherLogin(texte) {
  document.getElementById('message').textContent = texte;
  document.getElementById('wrap-login').style.display = 'block';
  document.getElementById('table-comptes').style.display = 'none';
}

function afficherTableau(comptes) {
  document.getElementById('message').textContent = '';
  document.getElementById('wrap-login').style.display = 'none';
  const table = document.getElementById('table-comptes');
  table.style.display = 'block';

  const corps = document.getElementById('corps-tableau');
  corps.innerHTML = '';

  for (const compte of comptes) {
    const tr = document.createElement('tr');

    const statutBadge = compte.actif
      ? '<span class="badge badge-actif">actif</span>'
      : '<span class="badge badge-suspendu">suspendu</span>';
    const adminBadge = compte.est_admin ? '<span class="badge badge-admin">admin</span>' : '';

    const salonsTxt = compte.salons.length
      ? compte.salons.map(s => s.nom + (s.est_demo ? ' (démo)' : '')).join(', ')
      : '—';

    const actionLabel = compte.actif ? 'Suspendre' : 'Réactiver';
    const actionRoute = compte.actif ? 'suspendre' : 'reactiver';

    tr.innerHTML = `
      <td>${compte.email}</td>
      <td>${statutBadge}${adminBadge}</td>
      <td class="salons">${salonsTxt}</td>
      <td>
        <button data-id="${compte.id}" data-action="${actionRoute}">${actionLabel}</button>
        <button class="danger" data-id="${compte.id}" data-action="supprimer" data-confirm="true">Supprimer</button>
      </td>
    `;
    corps.appendChild(tr);
  }

  corps.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (btn.dataset.confirm && !confirm("Supprimer définitivement ce compte et ses salons ? Cette action est irréversible.")) {
        return;
      }
      const res = await fetch(`/admin/comptes/${btn.dataset.id}/${btn.dataset.action}`, {
        method: 'POST',
        credentials: 'include',
      });
      if (res.ok) {
        chargerComptes();
      } else {
        const detail = (await res.json().catch(() => null))?.detail;
        afficherMessage(detail || "Action refusée.");
      }
    });
  });
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  const mot_de_passe = document.getElementById('login-mot-de-passe').value;
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, mot_de_passe }),
  });
  if (res.ok) {
    chargerComptes();
  } else {
    afficherLogin("Email ou mot de passe incorrect.");
  }
});

chargerComptes();
</script>
</body>
</html>
