<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon salon — Réceptionniste IA</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div class="top-bar">
    <h1 id="titre">Mon salon</h1>
    <nav>
      <select id="selecteur-salon"></select>
      <button id="logout">Se déconnecter</button>
    </nav>
  </div>
  <div class="page">
    <p id="message"></p>

    <div id="contenu" style="display:none">
      <div class="section-card">
        <h3 style="margin-top:0">Informations générales</h3>
        <label>Nom du salon</label>
        <input type="text" id="nom">

        <label style="margin-top:0.6rem">Numéro et rue</label>
        <input type="text" id="numero-et-rue" placeholder="12 rue de la Convention">
        <label style="margin-top:0.6rem">Complément d'adresse (optionnel)</label>
        <input type="text" id="complement" placeholder="Bâtiment B, 2e étage...">
        <div class="ligne" style="margin-top:0.6rem">
          <div>
            <label>Code postal</label>
            <input type="text" id="code-postal" placeholder="75015">
          </div>
          <div>
            <label>Ville</label>
            <input type="text" id="ville" placeholder="Paris">
          </div>
        </div>
        <div class="ligne" style="margin-top:0.6rem">
          <div>
            <label>Département (optionnel)</label>
            <input type="text" id="departement" placeholder="Paris">
          </div>
          <div>
            <label>Pays</label>
            <input type="text" id="pays" value="France">
          </div>
        </div>
        <p id="erreur-adresse" style="margin:0.4rem 0 0; color:#c62828; font-size:0.85rem"></p>

        <details style="margin-top:1rem">
          <summary class="subtitle" style="cursor:pointer">Description du salon (optionnelle)</summary>
          <textarea id="description" maxlength="500" rows="3" style="width:100%; margin-top:0.5rem" placeholder="Quelques mots sur votre salon..."></textarea>
        </details>
      </div>

      <div class="section-card">
        <h3 style="margin-top:0">Numéro de téléphone</h3>
        <p id="numero-twilio" style="margin:0"></p>
      </div>

      <div class="section-card">
        <h3 style="margin-top:0">Page publique</h3>
        <p style="margin:0">Vos clients peuvent prendre rendez-vous sur : <a id="lien-public" target="_blank" rel="noopener"></a></p>
      </div>

      <div class="section-card">
        <h3 style="margin-top:0">Google Agenda</h3>
        <p style="margin: 0 0 0.75rem">Statut : <span id="statut-agenda" class="badge"></span></p>
        <a id="lien-connexion-agenda" href="#"><button type="button">Connecter mon Google Agenda</button></a>
      </div>

      <div class="section-card">
        <h3 style="margin-top:0">Photos du salon</h3>
        <p class="subtitle" id="photos-info" style="margin:0 0 0.75rem">0/5 photos</p>
        <div class="galerie-photos" id="galerie-photos"></div>
        <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp" style="margin-top:0.75rem">
      </div>

      <div class="section-card">
        <h3 style="margin-top:0">Horaires d'ouverture</h3>
        <div id="horaires"></div>
      </div>

      <div class="section-card">
        <h3 style="margin-top:0">Jours de fermeture exceptionnelle</h3>
        <ul id="fermetures" style="list-style:none; padding:0; margin:0 0 0.75rem"></ul>
        <div class="ligne">
          <input type="date" id="nouvelle-fermeture">
          <button type="button" id="ajouter-fermeture">Ajouter</button>
        </div>
      </div>

      <div class="section-card">
        <h3 style="margin-top:0">Prestations</h3>
        <div id="prestations"></div>
      </div>

      <p><button id="enregistrer" class="primary">Enregistrer</button></p>
    </div>
  </div>

<script>
const JOURS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
const CATEGORIES = ['femme', 'homme', 'enfant'];
const salonId = new URLSearchParams(location.search).get('id');

let fermetures = [];
let prestations = { femme: {}, homme: {}, enfant: {} };
let photos = [];

function afficherMessage(texte) {
  document.getElementById('message').textContent = texte;
  document.getElementById('contenu').style.display = 'none';
}

function rendreHoraires(horaires) {
  const conteneur = document.getElementById('horaires');
  conteneur.innerHTML = JOURS.map(jour => {
    const plage = horaires[jour];
    return `
      <div class="jour-row" data-jour="${jour}">
        <label class="jour"><input type="checkbox" class="ouvert" ${plage ? 'checked' : ''}> ${jour}</label>
        <input type="time" class="ouverture" value="${plage ? plage.ouverture : '09:00'}" ${plage ? '' : 'disabled'}>
        <input type="time" class="fermeture" value="${plage ? plage.fermeture : '19:00'}" ${plage ? '' : 'disabled'}>
      </div>`;
  }).join('');

  conteneur.querySelectorAll('.ouvert').forEach(cb => {
    cb.addEventListener('change', () => {
      const row = cb.closest('.jour-row');
      row.querySelector('.ouverture').disabled = !cb.checked;
      row.querySelector('.fermeture').disabled = !cb.checked;
    });
  });
}

function lireHoraires() {
  const horaires = {};
  document.querySelectorAll('#horaires .jour-row').forEach(row => {
    const jour = row.dataset.jour;
    const ouvert = row.querySelector('.ouvert').checked;
    horaires[jour] = ouvert
      ? { ouverture: row.querySelector('.ouverture').value, fermeture: row.querySelector('.fermeture').value }
      : null;
  });
  return horaires;
}

function rendreFermetures() {
  const liste = document.getElementById('fermetures');
  liste.innerHTML = fermetures.map(d => `<li>${d} <button type="button" data-date="${d}" class="retirer-fermeture">retirer</button></li>`).join('');
  liste.querySelectorAll('.retirer-fermeture').forEach(btn => {
    btn.addEventListener('click', () => {
      fermetures = fermetures.filter(d => d !== btn.dataset.date);
      rendreFermetures();
    });
  });
}

function rendrePrestations() {
  const conteneur = document.getElementById('prestations');
  conteneur.innerHTML = CATEGORIES.map(cat => `
    <h3 style="font-size:1rem">${cat}</h3>
    <div class="lignes-prestations" data-categorie="${cat}">
      ${Object.entries(prestations[cat] || {}).map(([nom, prix]) => `
        <div class="ligne" data-nom="${nom}">
          <input type="text" class="prestation-nom" value="${nom}" placeholder="nom">
          <input type="number" class="prestation-prix" value="${prix}" min="0.01" step="0.01" placeholder="prix">
          <button type="button" class="retirer-prestation">retirer</button>
        </div>`).join('')}
    </div>
    <button type="button" class="ajouter-prestation" data-categorie="${cat}">+ ajouter une prestation</button>
  `).join('');

  conteneur.querySelectorAll('.retirer-prestation').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.ligne').remove());
  });

  conteneur.querySelectorAll('.ajouter-prestation').forEach(btn => {
    btn.addEventListener('click', () => {
      const bloc = conteneur.querySelector(`.lignes-prestations[data-categorie="${btn.dataset.categorie}"]`);
      const ligne = document.createElement('div');
      ligne.className = 'ligne';
      ligne.innerHTML = `
        <input type="text" class="prestation-nom" placeholder="nom">
        <input type="number" class="prestation-prix" min="0.01" step="0.01" placeholder="prix">
        <button type="button" class="retirer-prestation">retirer</button>`;
      ligne.querySelector('.retirer-prestation').addEventListener('click', () => ligne.remove());
      bloc.appendChild(ligne);
    });
  });
}

function lirePrestations() {
  const resultat = {};
  CATEGORIES.forEach(cat => {
    resultat[cat] = {};
    document.querySelectorAll(`.lignes-prestations[data-categorie="${cat}"] .ligne`).forEach(ligne => {
      const nom = ligne.querySelector('.prestation-nom').value.trim();
      const prix = parseFloat(ligne.querySelector('.prestation-prix').value);
      if (nom && prix > 0) resultat[cat][nom] = prix;
    });
  });
  return resultat;
}

function rendrePhotos() {
  document.getElementById('photos-info').textContent = `${photos.length}/5 photos`;
  document.getElementById('photo-input').disabled = photos.length >= 5;
  document.getElementById('galerie-photos').innerHTML = photos.map(nom => `
    <div class="photo-miniature" data-nom="${nom}">
      <img src="/uploads/salons/${salonId}/${nom}" alt="Photo du salon">
      <button type="button" class="retirer-photo" data-nom="${nom}">retirer</button>
    </div>`).join('');

  document.querySelectorAll('.retirer-photo').forEach(btn => {
    btn.addEventListener('click', async () => {
      const res = await fetch(`/api/salons/${salonId}/photos/${btn.dataset.nom}`, {
        method: 'DELETE',
        credentials: 'include',
      });
      if (res.ok) {
        const salon = await res.json();
        photos = salon.photos;
        rendrePhotos();
      } else {
        alert('Erreur lors de la suppression de la photo.');
      }
    });
  });
}

document.getElementById('photo-input').addEventListener('change', async (e) => {
  const fichier = e.target.files[0];
  e.target.value = '';
  if (!fichier) return;

  const formData = new FormData();
  formData.append('fichier', fichier);
  const res = await fetch(`/api/salons/${salonId}/photos`, {
    method: 'POST',
    credentials: 'include',
    body: formData,
  });

  if (res.ok) {
    const salon = await res.json();
    photos = salon.photos;
    rendrePhotos();
  } else {
    const detail = (await res.json().catch(() => null))?.detail;
    alert(detail || "Erreur lors de l'envoi de la photo.");
  }
});

async function charger() {
  if (!salonId) {
    afficherMessage("Aucun salon sélectionné.");
    return;
  }

  const res = await fetch(`/api/salons/${salonId}`, { credentials: 'include' });
  if (res.status === 401) {
    location.href = 'index.html';
    return;
  }
  if (res.status === 404) {
    afficherMessage("Ce salon n'existe pas ou ne vous appartient pas.");
    return;
  }
  if (!res.ok) {
    afficherMessage("Erreur lors du chargement du salon.");
    return;
  }

  const salon = await res.json();
  document.getElementById('contenu').style.display = 'block';
  document.getElementById('titre').textContent = salon.nom;
  document.getElementById('nom').value = salon.nom;
  document.getElementById('numero-et-rue').value = salon.numero_et_rue || '';
  document.getElementById('complement').value = salon.complement || '';
  document.getElementById('code-postal').value = salon.code_postal || '';
  document.getElementById('ville').value = salon.ville || '';
  document.getElementById('departement').value = salon.departement || '';
  document.getElementById('pays').value = salon.pays || 'France';
  document.getElementById('description').value = salon.description || '';
  document.getElementById('numero-twilio').textContent = salon.numero_twilio || 'Non attribué pour le moment';

  const lienPublic = document.getElementById('lien-public');
  lienPublic.href = `/salon/${salon.slug}`;
  lienPublic.textContent = `${location.origin}/salon/${salon.slug}`;

  photos = salon.photos;
  rendrePhotos();

  const statut = document.getElementById('statut-agenda');
  const lien = document.getElementById('lien-connexion-agenda');
  if (salon.calendrier_connecte) {
    statut.textContent = 'Connecté ✓';
    statut.className = 'badge badge-ok';
    lien.style.display = 'none';
  } else {
    statut.textContent = 'Non connecté';
    statut.className = 'badge badge-off';
    lien.href = `/api/oauth/google/authorize?salon_id=${salon.id}`;
  }

  rendreHoraires(salon.horaires);
  fermetures = salon.fermetures_exceptionnelles || [];
  rendreFermetures();
  prestations = salon.prestations;
  rendrePrestations();
}

async function chargerSelecteurSalons() {
  const res = await fetch('/api/salons', { credentials: 'include' });
  if (!res.ok) return;
  const salons = await res.json();
  const select = document.getElementById('selecteur-salon');
  select.innerHTML = salons.map(s =>
    `<option value="${s.id}" ${String(s.id) === salonId ? 'selected' : ''}>${s.nom}</option>`
  ).join('') + '<option value="__new__">+ Ajouter un salon</option>';
}

document.getElementById('selecteur-salon').addEventListener('change', async (e) => {
  const valeur = e.target.value;
  if (valeur !== '__new__') {
    location.href = `salon.html?id=${valeur}`;
    return;
  }
  const nom = prompt('Nom du nouveau salon :');
  if (!nom) {
    chargerSelecteurSalons();
    return;
  }
  const res = await fetch('/api/salons', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nom, horaires: {}, fermetures_exceptionnelles: [], prestations: {} }),
  });
  if (res.ok) {
    const salon = await res.json();
    location.href = `salon.html?id=${salon.id}`;
  } else {
    alert("Erreur lors de la création du salon.");
    chargerSelecteurSalons();
  }
});

document.getElementById('ajouter-fermeture').addEventListener('click', () => {
  const input = document.getElementById('nouvelle-fermeture');
  if (input.value && !fermetures.includes(input.value)) {
    fermetures.push(input.value);
    fermetures.sort();
    rendreFermetures();
    input.value = '';
  }
});

document.getElementById('enregistrer').addEventListener('click', async () => {
  document.getElementById('erreur-adresse').textContent = '';
  const payload = {
    nom: document.getElementById('nom').value,
    numero_et_rue: document.getElementById('numero-et-rue').value || null,
    complement: document.getElementById('complement').value || null,
    code_postal: document.getElementById('code-postal').value || null,
    ville: document.getElementById('ville').value || null,
    departement: document.getElementById('departement').value || null,
    pays: document.getElementById('pays').value || 'France',
    description: document.getElementById('description').value || '',
    horaires: lireHoraires(),
    fermetures_exceptionnelles: fermetures,
    prestations: lirePrestations(),
  };

  const res = await fetch(`/api/salons/${salonId}`, {
    method: 'PUT',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });

  if (res.ok) {
    document.getElementById('message').textContent = 'Enregistré.';
    document.getElementById('message').style.color = '#1e7e34';
    charger();
  } else if (res.status === 422) {
    const detail = (await res.json().catch(() => null))?.detail;
    const messageErreur = Array.isArray(detail) ? detail.map(d => d.msg).join(' ; ') : "Code postal invalide.";
    document.getElementById('erreur-adresse').textContent = messageErreur;
    document.getElementById('message').textContent = '';
  } else {
    const detail = (await res.json().catch(() => null))?.detail;
    document.getElementById('message').textContent = detail ? JSON.stringify(detail) : "Erreur lors de l'enregistrement.";
    document.getElementById('message').style.color = '#c62828';
  }
});

document.getElementById('logout').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
  location.href = 'index.html';
});

charger();
chargerSelecteurSalons();
</script>
</body>
</html>
